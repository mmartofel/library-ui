version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:24.14
    steps:
      - checkout
      - restore_cache:
          key: npm-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Unit tests
          command: npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      - run:
          name: Build
          command: npm run build
      - run:
          name: Check the generated API client matches the contract
          command: npm run contract:check
      - store_test_results:
          path: reports

workflows:
  build:
    jobs:
      - build
